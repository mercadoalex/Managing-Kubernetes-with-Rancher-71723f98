kind: playground

# NOTE: `name` gets a unique suffix appended by the platform on creation
# (e.g. rancher-k3s-downstream-ab12cd34). Use the suffixed name that
# `labctl playground create` prints in all subsequent commands and in lesson
# `playground.name` references. See playgrounds/README.md for the procedure.
name: rancher-k3s-downstream

title: Rancher with a Separate Downstream Cluster

description: |
  A two-cluster topology for the advanced (Module 3) lessons of the "Managing
  Kubernetes with Rancher" course. One K3s cluster runs Rancher (the upstream /
  management cluster); a second, fully independent K3s cluster (the downstream /
  user cluster) is provisioned empty so the student can register it into Rancher
  from the UI. The student works from a dev-machine workstation that already has
  kubectl and helm and a kubeconfig for the upstream cluster.

categories:
  - kubernetes

# This is a from-scratch topology, so it is built on the `flexbox` base - the
# only base that accepts an arbitrary machine set. The other bases (including
# `k3s`) come with a fixed machine set that cannot be extended, which is why we
# cannot simply add a fourth machine to the single-cluster `rancher-k3s`
# playground for a downstream cluster.
playground:
  networks:
    # A single shared network for all three machines. The two clusters are kept
    # distinct by their K3s datastores and tokens (the downstream gets a fresh,
    # independent K3s install), NOT by network isolation. Putting them on one
    # subnet is deliberate: iximiuz networks are isolated L2 bridges with no
    # routing between them, so a separate downstream subnet would leave the
    # downstream cluster unable to reach Rancher, and the cluster agent could
    # never connect to complete the import.
    - name: local
      subnet: 172.16.0.0/24

  machines:
    # The student's workstation. Reaches the upstream cluster's API server over
    # the shared network (kubeconfig pre-provisioned below). It never needs
    # direct kubectl access to the downstream cluster - importing that cluster
    # happens through Rancher, driven from the UI.
    - name: dev-machine
      users:
        - name: root
        - name: laborant
          default: true
          welcome: |
            This is your workstation. Rancher (the upstream cluster) is
            pre-installed and reachable from the "Rancher" tab. A second,
            empty K3s cluster (downstream-01) is waiting to be imported into
            Rancher. `kubectl get nodes` here targets the UPSTREAM cluster.
      drives:
        - source: k3s-dev-machine
          mount: /
          size: 30GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.5/24
      resources:
        cpuCount: 1
        ramSize: 1GiB

    # Upstream / management cluster: a single-node K3s that runs Rancher. Uses
    # the baked k3s-cplane rootfs (K3s server auto-starts on boot). Rancher is
    # installed on top by the init tasks below. Rancher needs ~2 vCPU / 4 GiB.
    - name: rancher-server
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: k3s-cplane
          mount: /
          size: 30GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.2/24
      resources:
        cpuCount: 2
        ramSize: 4GiB

    # Downstream / user cluster: a plain Ubuntu VM. K3s is installed FRESH by an
    # init task (not the baked k3s-cplane image) so this cluster has its own
    # independent token and datastore and can never accidentally HA-join the
    # Rancher cluster, even though it shares the network. It starts with nothing
    # on it - registering it into Rancher is the student's job.
    - name: downstream-01
      users:
        - name: root
        - name: laborant
          default: true
          welcome: |
            This is an independent K3s cluster (the downstream / user cluster).
            It is NOT yet managed by Rancher - importing it is the exercise.
      drives:
        - source: ubuntu-24-04
          mount: /
          size: 20GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.3/24
      resources:
        cpuCount: 1
        ramSize: 2GiB

  tabs:
    - kind: ide
      machine: dev-machine
    - kind: kexp
      machine: dev-machine
    - kind: terminal
      machine: dev-machine
    - kind: terminal
      machine: downstream-01
    # Rancher is served over HTTPS (self-signed) on NodePort 30443. Unlike the
    # single-cluster rancher-k3s playground (which uses plain HTTP), this
    # playground MUST run Rancher in self-signed mode so the read-only `cacerts`
    # setting gets populated - the downstream cluster agent needs that CA to
    # verify Rancher and connect. In self-signed mode Rancher force-redirects
    # HTTP to HTTPS, so a plain-HTTP tab is useless here. tls: true tells the
    # iximiuz proxy to speak HTTPS to the NodePort; the dashboard WebSocket
    # rides wss:// end-to-end, which the proxy supports.
    - kind: http-port
      name: Rancher
      machine: rancher-server
      number: 30443
      tls: true
      target: window

  initTasks:
    # --- Upstream cluster: workstation kubeconfig ---
    # Fetch the Rancher cluster's kubeconfig onto the dev-machine and rewrite
    # the API server address from 127.0.0.1 to the rancher-server IP so
    # kubectl/helm on the workstation reach the upstream cluster over the shared
    # network. This kubeconfig targets the UPSTREAM cluster only.
    init_kubeconfig_devmachine:
      init: true
      machine: dev-machine
      user: laborant
      timeout_seconds: 180
      run: |
        for i in $(seq 1 45); do
          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=3 rancher-server \
               'sudo test -f /etc/rancher/k3s/k3s.yaml' 2>/dev/null; then
            break
          fi
          sleep 2
        done
        mkdir -p "$HOME/.kube"
        ssh -o StrictHostKeyChecking=no rancher-server 'sudo cat /etc/rancher/k3s/k3s.yaml' \
          | sed 's/127.0.0.1/172.16.0.2/' > "$HOME/.kube/config"
        chmod 600 "$HOME/.kube/config"
        grep -q 'KUBECONFIG=' "$HOME/.bashrc" \
          || echo 'export KUBECONFIG=$HOME/.kube/config' >> "$HOME/.bashrc"
        export KUBECONFIG="$HOME/.kube/config"
        kubectl get nodes

    # --- Downstream cluster: fresh, independent K3s ---
    # Install K3s from scratch on downstream-01 with its own token. Traefik and
    # ServiceLB are disabled to keep the node lean (the import exercise does not
    # need them). --tls-san lets the API server certificate cover the node IP.
    # This runs before the import step so the downstream cluster is up and
    # healthy, waiting to be registered into Rancher.
    init_downstream_k3s:
      init: true
      machine: downstream-01
      user: root
      timeout_seconds: 300
      run: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--tls-san 172.16.0.3 --disable=traefik --disable=servicelb" sh -s -
        for i in $(seq 1 60); do
          if k3s kubectl get nodes 2>/dev/null | grep -q ' Ready '; then
            break
          fi
          sleep 2
        done
        k3s kubectl get nodes

    # --- Upstream cluster: cert-manager ---
    init_cert_manager:
      init: true
      machine: dev-machine
      user: laborant
      needs:
        - init_kubeconfig_devmachine
      timeout_seconds: 300
      run: |
        export KUBECONFIG="$HOME/.kube/config"
        helm repo add jetstack https://charts.jetstack.io
        helm repo update
        helm install cert-manager jetstack/cert-manager \
          --namespace cert-manager \
          --create-namespace \
          --set crds.enabled=true
        kubectl -n cert-manager rollout status deployment/cert-manager --timeout=240s
        kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=240s
        kubectl -n cert-manager rollout status deployment/cert-manager-cainjector --timeout=240s

    # --- Upstream cluster: Rancher (self-signed TLS) ---
    # This playground installs Rancher in its DEFAULT self-signed mode (NO
    # tls=external). That is the crucial difference from the single-cluster
    # rancher-k3s playground, and it is required for cluster import to work:
    #
    #   - tls=external leaves Rancher's read-only `cacerts` setting EMPTY. The
    #     downstream cluster agent then cannot verify Rancher's certificate and
    #     crash-loops with "certificate signed by unknown authority". `cacerts`
    #     is read-only (admission webhook denies patches), so this cannot be
    #     fixed after the fact - it must be populated at install time, which
    #     only the self-signed (or a real-CA) install mode does.
    #   - In self-signed mode Rancher generates its own CA, populates `cacerts`,
    #     and serves HTTPS. The agent uses the `--insecure` registration command
    #     and verifies against that CA. Confirmed working end-to-end.
    #
    # hostname uses an sslip.io name that resolves to the reachable node IP
    # (172.16.0.2.sslip.io -> 172.16.0.2). This matters twice: it becomes the
    # certificate SAN, and it is what the agent connects to. A name like
    # rancher.localhost would not resolve from the downstream cluster.
    #
    # Rancher is exposed as a NodePort on BOTH 30080 (http) and 30443 (https).
    # It force-redirects http->https, so the browser tab and the agent both use
    # https://172.16.0.2.sslip.io:30443. server-url is set to that address so the
    # agent registration manifest points somewhere routable from downstream-01.
    init_rancher:
      init: true
      machine: dev-machine
      user: laborant
      needs:
        - init_cert_manager
      timeout_seconds: 600
      run: |
        export KUBECONFIG="$HOME/.kube/config"
        helm repo add rancher-stable https://releases.rancher.com/server-charts/stable
        helm repo update
        kubectl create namespace cattle-system
        helm install rancher rancher-stable/rancher \
          --namespace cattle-system \
          --set hostname=172.16.0.2.sslip.io \
          --set bootstrapPassword=admin \
          --set replicas=1
        kubectl -n cattle-system rollout status deployment/rancher --timeout=480s
        # Expose both HTTP (30080) and HTTPS (30443). 30443 is what the tab and
        # the agent use; 30080 exists only because Rancher redirects it to https.
        kubectl -n cattle-system patch svc rancher \
          -p '{"spec":{"type":"NodePort","ports":[{"name":"http","port":80,"targetPort":80,"nodePort":30080},{"name":"https","port":443,"targetPort":443,"nodePort":30443}]}}'
        # server-url must be the reachable https NodePort address so the agent
        # manifest handed to downstream clusters points somewhere routable.
        for i in $(seq 1 30); do
          if kubectl get settings.management.cattle.io server-url >/dev/null 2>&1; then
            break
          fi
          sleep 4
        done
        kubectl patch settings.management.cattle.io server-url \
          --type merge -p '{"value":"https://172.16.0.2.sslip.io:30443"}'
        # CRITICAL: patching the server-url SETTING alone is not durable - Rancher
        # rewrites server-url to whatever address the browser first opens the UI
        # from. In this playground the student opens the Rancher tab via the
        # iximiuz proxy hostname (…iximiuz.com), so server-url drifts to that
        # proxy URL. The downstream cluster agent then inherits CATTLE_SERVER =
        # the proxy hostname, which is auth-gated and returns HTML instead of the
        # Rancher API, so the agent crash-loops and the imported cluster is stuck
        # Pending forever.
        #
        # The fix is to pin the URL via the CATTLE_SERVER_URL env var on the
        # Rancher deployment. Rancher treats that env as authoritative and does
        # NOT auto-overwrite it on browser access, so server-url stays internal
        # regardless of how the UI is reached. This keeps the agent's
        # CATTLE_SERVER pointed at the routable internal address.
        kubectl -n cattle-system set env deployment/rancher \
          CATTLE_SERVER_URL=https://172.16.0.2.sslip.io:30443
        kubectl -n cattle-system rollout status deployment/rancher --timeout=300s
        # Re-assert the setting after the rollout, in case it was touched.
        kubectl patch settings.management.cattle.io server-url \
          --type merge -p '{"value":"https://172.16.0.2.sslip.io:30443"}' || true

  accessControl:
    canList:
      - owner
    canRead:
      - owner
    canStart:
      - owner
