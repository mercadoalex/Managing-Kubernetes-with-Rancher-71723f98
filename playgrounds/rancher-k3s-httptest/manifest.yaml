kind: playground

# EXPERIMENT: expose Rancher over plain HTTP via a NodePort so the iximiuz
# http-port tab carries ws:// (not wss://). Goal: get a fully working Rancher
# dashboard in an embedded/opened tab with ZERO student tooling (no labctl
# port-forward). If the WebSocket connects through the tab this way, this
# approach replaces the port-forward method.
name: rancher-k3s-httptest

title: EXPERIMENT - Rancher over plain HTTP NodePort

description: |
  Throwaway experiment playground. Rancher installed with tls=external (plain
  HTTP), exposed as a NodePort, and surfaced via a plain-HTTP http-port tab to
  test whether the iximiuz proxy forwards the dashboard WebSocket.

categories:
  - kubernetes

playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24

  machines:
    - name: dev-machine
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: k3s-dev-machine
          mount: /
          size: 30GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.5/24

    - name: cplane-01
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: k3s-cplane
          mount: /
          size: 30GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.2/24

    - name: node-01
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: k3s-node
          mount: /
          size: 30GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.3/24

  tabs:
    - kind: terminal
      machine: dev-machine
    - kind: terminal
      machine: cplane-01
    # Plain-HTTP tab pointed straight at Rancher's NodePort on the control
    # plane. No tls, no hostRewrite - so the proxy carries ws:// upgrades.
    - kind: http-port
      name: Rancher
      machine: cplane-01
      number: 30080
      target: window

  initTasks:
    init_kubeconfig_devmachine:
      init: true
      machine: dev-machine
      user: laborant
      timeout_seconds: 180
      run: |
        for i in $(seq 1 45); do
          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=3 cplane-01 \
               'sudo test -f /etc/rancher/k3s/k3s.yaml' 2>/dev/null; then
            break
          fi
          sleep 2
        done
        mkdir -p "$HOME/.kube"
        ssh -o StrictHostKeyChecking=no cplane-01 'sudo cat /etc/rancher/k3s/k3s.yaml' \
          | sed 's/127.0.0.1/172.16.0.2/' > "$HOME/.kube/config"
        chmod 600 "$HOME/.kube/config"
        export KUBECONFIG="$HOME/.kube/config"
        kubectl get nodes

    init_cert_manager:
      init: true
      machine: dev-machine
      user: laborant
      needs:
        - init_kubeconfig_devmachine
      timeout_seconds: 300
      run: |
        export KUBECONFIG="$HOME/.kube/config"
        helm repo add jetstack https://charts.jetstack.io
        helm repo update
        helm install cert-manager jetstack/cert-manager \
          --namespace cert-manager \
          --create-namespace \
          --set crds.enabled=true
        kubectl -n cert-manager rollout status deployment/cert-manager --timeout=240s
        kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=240s
        kubectl -n cert-manager rollout status deployment/cert-manager-cainjector --timeout=240s

    # Install Rancher with TLS terminated externally (plain HTTP), no ingress
    # dependency, then expose it as a NodePort on 30080.
    init_rancher_http:
      init: true
      machine: dev-machine
      user: laborant
      needs:
        - init_cert_manager
      timeout_seconds: 600
      run: |
        export KUBECONFIG="$HOME/.kube/config"
        helm repo add rancher-stable https://releases.rancher.com/server-charts/stable
        helm repo update
        kubectl create namespace cattle-system
        # tls=external: Rancher serves plain HTTP and trusts an upstream proxy
        # for TLS. hostname is required by the chart; we set it but reach Rancher
        # by IP:NodePort, not by this name.
        helm install rancher rancher-stable/rancher \
          --namespace cattle-system \
          --set hostname=rancher.localhost \
          --set bootstrapPassword=admin \
          --set tls=external \
          --set replicas=1
        kubectl -n cattle-system rollout status deployment/rancher --timeout=480s
        # Expose Rancher's HTTP port (80) as a NodePort on 30080 for the tab.
        kubectl -n cattle-system patch svc rancher \
          -p '{"spec":{"type":"NodePort","ports":[{"name":"http","port":80,"targetPort":80,"nodePort":30080}]}}'

  accessControl:
    canList:
      - owner
    canRead:
      - owner
    canStart:
      - owner
